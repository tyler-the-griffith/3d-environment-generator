# Built-in species library. Sizes are typical mature sizes (bare numbers = feet).
# Colors are approximate rendering colors, not botanical references.
#
# Fields:
#   common, botanical, aliases[]    names used to match plan keys (case/punctuation-insensitive)
#   category   tree | shrub | grass | perennial | groundcover | vine | annual
#   form       generator shape — see landviz/catalog/__init__.py KNOWN_FORMS
#   height, spread, years_to_mature
#   evergreen, winter (bare | evergreen | dormant | persistent)
#   foliage    hex, or {spring, summer, fall, winter}; fall_color is shorthand for foliage.fall
#   flowers    {color, months: [..], density 0-1}
#   leaf_size  tiny | small | medium | large | needle | blade
#   generator  free-form overrides passed to the Blender plant generator
#   asset      path to a .blend/.glb/.obj model to use instead of the generator

